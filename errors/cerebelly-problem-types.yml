name: Cerebelly error catalog
description: Cerebelly publishes no OpenAPI and no prose error reference, so this catalog is derived from
  the typed error enumerations in the live Storefront GraphQL schema plus the JSON-RPC envelope of the
  UCP MCP endpoint. Every code below exists in the introspected schema Cerebelly's own host serves on
  2026-08-09; none were invented and none were copied from vendor documentation.
format: graphql-typed-user-errors
rfc9457: false
rfc9457_note: No surface returns application/problem+json. The MCP endpoint uses the JSON-RPC 2.0 error
  member; GraphQL uses a top-level errors array for transport failures and typed userErrors payload fields
  for domain failures.
envelopes:
- surface: https://cerebelly.com/api/ucp/mcp
  style: JSON-RPC 2.0
  fields:
  - jsonrpc
  - id
  - error.code
  - error.message
  - error.data
  transport_status: HTTP 200 with an error member; HTTP 429 on rate limit
- surface: https://cerebelly.com/api/2026-01/graphql.json
  style: GraphQL dual-channel
  transport_errors:
    location: errors[]
    fields:
    - message
    - locations
    - path
    - extensions
  domain_errors:
    location: <mutation>.userErrors[] / .warnings[]
    interface: DisplayableError
    fields:
    - field
    - message
    - code
    implementations:
    - CartUserError
    - CustomerUserError
    - MetafieldDeleteUserError
    - MetafieldsSetUserError
    - UserError
    - UserErrorsShopPayPaymentRequestSessionUserErrors
rate_limiting:
  mcp:
    status: 429
    guidance: Back off on 429 responses (published in llms.txt).
    basis: per IP
  graphql:
    signal: extensions.cost.requestedQueryCost on every response
    basis: query cost
