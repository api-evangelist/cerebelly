observations:
- Every domain error carries a machine-readable code enum plus a field path, which is stronger than a
  bare message string and is what makes agent-side error handling tractable on this surface.
- IDEMPOTENCY_KEY_ALREADY_USED corroborates the required meta.idempotency-key on complete_checkout — see
  conventions/cerebelly-conventions.yml.
- Payment decline reasons surface through CompletionErrorCode and the PAYMENTS_CREDIT_CARD_* members of
  CartErrorCode. Cerebelly is a merchant rather than a payments provider, so no separate decline-code
  artifact is emitted.
- No remediation prose is published for any code. Titles and actions would have to be inferred, so they
  are deliberately omitted rather than invented.
