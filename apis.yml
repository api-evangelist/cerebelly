- aid: cerebelly-storefront-graphql
  name: Cerebelly Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API as served from cerebelly.com. Answers
    unauthenticated introspection: 416 types, 35 root queries and 41 mutations covering
    products, collections, blog articles, pages, menus, metaobjects, predictive search,
    localization, cart lifecycle and Shop Pay. Date-based API versioning (2025-10 through
    2026-07 supported) is discoverable through the publicApiVersions query.'
  humanURL: https://cerebelly.com/agents.md
  baseURL: https://cerebelly.com/api/2026-01/graphql.json
