apis:
- aid: cerebelly-ucp-commerce-mcp
  name: Cerebelly UCP Commerce MCP
  description: 'Cerebelly''s Universal Commerce Protocol (UCP) MCP endpoint, served
    anonymously from the storefront host. A tools/list call returns 13 tools with full
    JSON Schema draft 2020-12 input schemas covering catalog search and lookup, product
    detail, cart lifecycle, and the full checkout lifecycle through buyer-approved
    completion. Checkout completion carries an idempotency-key. This is the Shopify
    UCP implementation as deployed on cerebelly.com.'
  humanURL: https://cerebelly.com/llms.txt
  baseURL: https://cerebelly.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Universal Commerce Protocol
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/cerebelly-mcp.yml
  - type: ToolCrosswalk
    url: mcp/cerebelly-tool-crosswalk.yml
  - type: JSONSchema
    url: json-schema/cerebelly-ucp-tool-schemas.json
  - type: Documentation
