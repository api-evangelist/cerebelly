name: Cerebelly UCP MCP ↔ Storefront GraphQL crosswalk
description: >-
  Binds each of the 13 live UCP MCP tools to the Storefront GraphQL field(s) that
  back the same capability. Cerebelly publishes NO OpenAPI, so the usual rest[]
  column is empty on every row and the binding column is `graphql` throughout —
  the crosswalk is still emitted because both a machine-readable MCP surface and a
  machine-readable GraphQL surface are live and anonymously introspectable, which
  is exactly the pair this artifact exists to reconcile. Every field name below was
  read out of the live introspection result; none were assumed. Confidence is set
  honestly: the UCP checkout family has no Checkout type in the 2026-01 Storefront
  schema, so those rows bind to the cart-completion mutations that replaced it.
surfaces:
  openapi: null
  openapi_note: >-
    No OpenAPI is published on any Cerebelly host. /openapi.json, /openapi.yaml,
    /swagger.json, /v1/openapi.json, /api-docs, /docs and /redoc all 404 on
    cerebelly.com, and api./developer./docs.cerebelly.com do not resolve.
  graphql:
    endpoint: https://cerebelly.com/api/2026-01/graphql.json
    gated: false
    note: Anonymous introspection returns HTTP 200 — 416 types, 35 queries, 41 mutations.
  mcp:
    endpoint: https://cerebelly.com/api/ucp/mcp
    gated: false
    note: Anonymous tools/list returns HTTP 200 with 13 tools and full inputSchemas.
  customer_account_api:
    endpoint: https://account.cerebelly.com/customer/api/2026-01/graphql
    gated: true
    note: Returns HTTP 401 anonymously; requires an OIDC customer access token.
