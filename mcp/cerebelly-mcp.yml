generated: '2026-08-09'
method: searched
source: https://cerebelly.com/api/ucp/mcp
name: Cerebelly UCP Commerce MCP
status: live
description: >-
  A live, anonymously reachable Model Context Protocol endpoint on Cerebelly's own
  storefront host. An unauthenticated POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"}
  returns HTTP 200 with 13 tools, each carrying a complete JSON Schema draft 2020-12
  inputSchema. This is Shopify's Universal Commerce Protocol implementation as deployed
  on cerebelly.com — Cerebelly does not author it, but it is served from Cerebelly's
  host under Cerebelly's domain and it transacts against Cerebelly's catalog.
endpoint: https://cerebelly.com/api/ucp/mcp
transport: streamable-http
protocol: mcp
authentication: >-
  None required for tools/list or for catalog and cart tools. Checkout completion
  requires a buyer-approved payment instrument produced by one of the configured
  payment handlers; Cerebelly's own llms.txt and robots.txt both state that agents
  must not finalize payment without contemporaneous human approval.
discovery:
- https://cerebelly.com/.well-known/ucp
- https://cerebelly.com/llms.txt
- https://cerebelly.com/agents.md
- https://cerebelly.com/robots.txt
ucp:
  version: '2026-04-08'
  supported_versions:
  - '2026-04-08'
  - '2026-01-23'
  specification: https://ucp.dev/2026-04-08/specification/overview/
  service: dev.ucp.shopping
  schema: https://ucp.dev/2026-04-08/services/shopping/mcp.openrpc.json
  capabilities:
  - dev.ucp.shopping.checkout
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.discount
  - dev.ucp.shopping.cart
  - dev.ucp.shopping.catalog.search
  - dev.ucp.shopping.catalog.lookup
  payment_handlers:
  - id: gpay
    family: com.google.pay
    version: '2026-01-11'
    note: >-
      Google Pay, merchant_name "Cerebelly", tokenization gateway "shopify".
      Card networks VISA, MASTERCARD, AMEX, DISCOVER.
  - id: shopify.card
    family: dev.shopify.card
    version: '2026-01-15'
    note: Direct card handler; visa, master, american_express, discover, diners_club.
  - id: shop_pay
    family: dev.shopify.shop_pay
    version: '2026-04-08'
tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store, hosted on Shopify.
  required: [meta, catalog]
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier. Accepts 1–10 ids.
  required: [meta, catalog]
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier, optionally for selected variant options.
  required: [meta, catalog]
- name: get_cart
  category: cart
  description: Get the cart contents.
  required: [meta, id]
- name: create_cart
  category: cart
  description: Creates a new cart from line items keyed on product-variant id.
  required: [meta, cart]
- name: update_cart
  category: cart
  description: Perform updates to a cart.
  required: [meta, id, cart]
- name: cancel_cart
  category: cart
  description: Cancels a cart.
  required: [meta, id]
- name: get_checkout
  category: checkout
  description: Returns checkout detail including line items, totals, discounts and taxes.
  required: [meta, id]
- name: create_checkout
  category: checkout
  description: Creates a checkout and returns its line items, totals, discounts and taxes.
  required: [meta, checkout]
- name: update_checkout
  category: checkout
  description: Updates a checkout — shipping address, delivery method, discounts, payment instruments.
  required: [meta, id, checkout]
- name: complete_checkout
  category: checkout
  description: >-
    Completes a checkout and returns the result. The ONLY tool that requires
    meta.idempotency-key, and the only one gated on explicit buyer approval.
  required: [meta, id, checkout]
  idempotent: true
  idempotency_key: meta.idempotency-key
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
  required: [meta, id]
- name: get_order
  category: order
  description: Get the details of an order by gid://shopify/Order/{id}.
  required: [meta, id]
schemas: ../json-schema/cerebelly-ucp-tool-schemas.json
crosswalk: cerebelly-tool-crosswalk.yml
