aid: cerebelly
name: Cerebelly
description: 'Cerebelly is an organic baby and toddler food company founded by a practicing
  neurosurgeon with a PhD in developmental neurobiology from Stanford, making veggie-first
  purees, bone-broth protein purees, dairy-free smoothie pouches, Smart Bars and Clever
  Bars formulated around 16 brain-supporting nutrients. Its direct-to-consumer storefront
  at cerebelly.com runs on Shopify, and that storefront is its API surface: an anonymous
  Universal Commerce Protocol (UCP) MCP endpoint exposing 13 catalog, cart and checkout
  tools, a public Shopify Storefront GraphQL API answering unauthenticated introspection,
  an OpenID Connect customer-account authorization server, and a published llms.txt /
  agents.md pair that tells AI shopping agents how to transact. Cerebelly ships no
  developer program of its own — every machine-readable surface here is the Shopify
  commerce platform as deployed on Cerebelly''s own hosts.'
